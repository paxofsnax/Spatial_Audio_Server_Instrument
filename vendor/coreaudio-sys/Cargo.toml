# Antopia: vendored fork of coreaudio-sys 0.2.2.
# Patches (see build.rs): uses pre-generated bindings instead of bindgen,
# since bindgen 0.32 cannot run against the modern libclang on this machine.
# Wired up via [patch.crates-io] in the workspace root Cargo.toml.
[package]
name = "coreaudio-sys"
version = "0.2.2"
authors = ["Mitchell Nordine <mitchell.nordine@gmail.com>"]
description = "Bindings for Apple's CoreAudio frameworks generated via rust-bindgen"
license = "MIT"
keywords = ["core", "audio", "unit", "osx", "ios"]
readme = "README.md"
homepage = "https://github.com/RustAudio/coreaudio-sys"
repository = "https://github.com/RustAudio/coreaudio-sys.git"
build = "build.rs"

[features]
default = ["audio_toolbox", "audio_unit", "core_audio", "open_al", "core_midi"]
audio_toolbox = []
audio_unit = []
core_audio = []
open_al = []
core_midi = []
